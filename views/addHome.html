<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Home</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body class="min-h-screen bg-gray-100 text-gray-800">
    <header class="bg-white border-b border-gray-200 py-8 text-center">
      <h1 class="text-4xl font-bold text-red-600">
        Enter Your Details
      </h1>
    </header>

    <main class="flex justify-center mt-20">
      <form
        action="/host/add-home"
        method="POST"
        class="bg-white p-8 rounded-xl shadow-md w-full max-w-md"
      >
        <div class="mb-6">
          <label class="block text-sm font-medium mb-2 text-gray-700">
            House Name
          </label>
          <input
            type="text"
            name="houseName"
            placeholder="Enter the name of your house"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-400 focus:border-red-400"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-3 rounded-lg transition transform hover:-translate-y-1"
        >
          Submit
        </button>
      </form>
    </main>
  </body>
</html>
